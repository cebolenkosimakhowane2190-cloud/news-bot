name: News alerts
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to keep running (0 = one quick check)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: news-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || '50' }}
          CHECK_EVERY: "300"
          PYTHONUNBUFFERED: "1"
        run: python bot.py
      - name: Save memory
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done
